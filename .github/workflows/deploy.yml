name: Build and Deploy

on:
  push:
    branches: [main]

# ══════════════════════════════════════════════════════════════════════════════
# JOB 1 — Build images and push to Docker Hub
# ══════════════════════════════════════════════════════════════════════════════
jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # IMAGE_REGISTRY is the shared prefix for all three images,
      # e.g. "myusername/jkt48tracker"
      - name: Export image registry prefix
        run: |
          echo "IMAGE_REGISTRY=${{ secrets.DOCKERHUB_USERNAME }}/jkt48tracker" \
            >> "$GITHUB_ENV"

      # ── backend ──
      - name: Build and push backend
        run: |
          docker build \
            -t "$IMAGE_REGISTRY-backend:${{ github.sha }}" \
            -t "$IMAGE_REGISTRY-backend:latest" \
            ./backend
          docker push --all-tags "$IMAGE_REGISTRY-backend"

      # ── frontend ──
      - name: Build and push frontend
        run: |
          docker build \
            -t "$IMAGE_REGISTRY-frontend:${{ github.sha }}" \
            -t "$IMAGE_REGISTRY-frontend:latest" \
            ./frontend
          docker push --all-tags "$IMAGE_REGISTRY-frontend"

      # ── scraper tool ──
      - name: Build and push tool
        run: |
          docker build \
            -t "$IMAGE_REGISTRY-tool:${{ github.sha }}" \
            -t "$IMAGE_REGISTRY-tool:latest" \
            ./tool
          docker push --all-tags "$IMAGE_REGISTRY-tool"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 — Deploy to GCE
  # ════════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to GCE
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Copy only the files the server needs (compose file + Caddyfile).
      # Secrets stay in the .env file already on the server.
      - name: Copy deployment files to GCE
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yaml,Caddyfile"
          target: /opt/jkt48tracker

      - name: Deploy on GCE
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}/jkt48tracker
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,IMAGE_REGISTRY
          script: |
            set -euo pipefail
            cd /opt/jkt48tracker

            # Stamp the deployed commit SHA into .env so docker compose picks it up
            if grep -q '^IMAGE_TAG=' .env 2>/dev/null; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi

            if grep -q '^IMAGE_REGISTRY=' .env 2>/dev/null; then
              sed -i "s|^IMAGE_REGISTRY=.*|IMAGE_REGISTRY=${IMAGE_REGISTRY}|" .env
            else
              echo "IMAGE_REGISTRY=${IMAGE_REGISTRY}" >> .env
            fi

            # Pull new images from Docker Hub (public — no auth needed)
            docker compose -f docker-compose.prod.yaml pull

            # Recreate changed containers, leave database intact
            docker compose -f docker-compose.prod.yaml up -d --remove-orphans

            # Remove dangling images to free disk space
            docker image prune -f
