services:
  backend:
    image: ghcr.io/rahandi/jkt48tracker-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_HOST: central-mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASS: ${DATABASE_PASS}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports:
      - "8000:8000"
    networks:
      - central-db

  frontend:
    image: ghcr.io/rahandi/jkt48tracker-frontend:latest
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - central-db

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_CLEANUP: true
      REPO_USER: ${GHCR_USER}
      REPO_PASS: ${GHCR_TOKEN}
      DOCKER_API_VERSION: "1.41"

networks:
  central-db:
    external: true
    name: central-db
