services:
  backend:
    image: jkt48tracker-backend:latest
    build: ../backend
    container_name: backend
    restart: unless-stopped
    depends_on:
      backend-db-migrate:
        condition: service_completed_successfully
    ports:
      - 8000:8000
    environment:
      - DATABASE_HOST=database
      - DATABASE_PORT=3306
      - DATABASE_NAME=jkt48tracker
      - DATABASE_USER=jkt48tracker
      - DATABASE_PASS=jkt48tracker
      - INTERNAL_API_KEY=dev-internal-key

  database:
    image: mysql:9.3.0
    container_name: database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jkt48tracker
      MYSQL_USER: jkt48tracker
      MYSQL_PASSWORD: jkt48tracker
    volumes:
      - ./data/db:/var/lib/mysql
    ports:
      - 3307:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend-db-migrate:
    image: jkt48tracker-backend:latest
    build: ../backend
    container_name: backend-db-migrate
    depends_on:
      database:
        condition: service_healthy
    entrypoint: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_HOST=database
      - DATABASE_PORT=3306
      - DATABASE_NAME=jkt48tracker
      - DATABASE_USER=jkt48tracker
      - DATABASE_PASS=jkt48tracker

  tool-member-sync:
    image: jkt48tracker-tool:latest
    build: ../tool
    container_name: tool-member-sync
    profiles: ["sync"]
    depends_on:
      - backend
    environment:
      - INTERNAL_API_URL=http://backend:8000/internal
      - INTERNAL_API_KEY=dev-internal-key
      - SCRAPER_HEADLESS=true