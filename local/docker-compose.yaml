services:
  backend:
    image: test:1
    container_name: backend
    depends_on:
      tool-migrate:
        condition: service_completed_successfully
    ports:
      - 8000:8000
    environment:
      - DATABASE_HOST=database
      - DATABASE_PORT=3306
      - DATABASE_NAME=jkt48tracker
      - DATABASE_USER=jkt48tracker
      - DATABASE_PASS=jkt48tracker
    
  database:
    image: mysql:9.3.0
    container_name: database
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jkt48tracker
      MYSQL_USER: jkt48tracker
      MYSQL_PASSWORD: jkt48tracker
    volumes:
      - ./data/db:/var/lib/mysql
    ports:
      - 3307:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  tool-migrate:
    image: test:1
    container_name: tool-migrate
    depends_on:
      database:
        condition: service_healthy
    entrypoint: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_HOST=database
      - DATABASE_PORT=3306
      - DATABASE_NAME=jkt48tracker
      - DATABASE_USER=jkt48tracker
      - DATABASE_PASS=jkt48tracker